project:
  type: website
  output-dir: docs
  resources:
    - "Alex-Medina-Tech-Resume.pdf"
    - "LitQuest.pdf"

website:
  title: "Alexandra Medina"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Past Project Showcase

format:
  html:
    theme:
      light: lux
      # I really liked the minimalistic look and it helps with a more professional look
